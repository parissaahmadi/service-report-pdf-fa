[project]
name = "service-report-pdf-fa"
version = "0.1.0"
description = "Bilingual (Persian/English) right-to-left PDF calibration certificates and service reports. Pure-Python shaping + bidi on top of reportlab."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["reportlab>=4.0"]

[project.scripts]
service-report = "service_report.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pdfplumber>=0.11",
    "fonttools>=4.67.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/service_report"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # a few long lines carry literal Persian data
